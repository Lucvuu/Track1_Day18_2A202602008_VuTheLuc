<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>AI Support Radar — Lab Coach Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="labcoach-dashboard.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <div class="ident">
          <span class="ident-name" id="class-name"></span>
          <span class="ident-task" id="class-task"></span>
        </div>
        <div class="dash-actions">
          <label class="switch" id="pause-switch">
            <input type="checkbox" id="pause-toggle" />
            <span>Tạm dừng AI</span>
          </label>
          <button class="btn btn-secondary theme-toggle" id="theme-toggle" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
      <div class="topbar-row">
        <div class="ident-meta">
          <span id="class-size"></span>
          <span class="dot-sep" aria-hidden="true"></span>
          <span id="class-time"></span>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <div id="pause-banner" class="note-box tone-warning hidden">
      <strong>AI đang tạm dừng.</strong> Không tự Act với case mới cho tới khi bạn bật lại. Case đang mở vẫn giữ nguyên.
    </div>

    <div id="kpi-row" class="stats mt-16"></div>

    <div class="state-head-sub">
      <h2>Tiến độ checkpoint cả lớp</h2>
    </div>
    <div id="checkpoint-progress" class="cp-grid"></div>

    <div class="caseview mt-16">
      <div class="caseview-main">
        <div class="state-head-sub">
          <h2>Cần bạn chú ý ngay</h2>
        </div>
        <div id="priority-list" class="case-list"></div>

        <div class="state-head-sub">
          <h2>AI đã tự xử lý</h2>
        </div>
        <div id="act-list" class="case-list"></div>

        <div class="state-head-sub">
          <h2>Toàn bộ nhóm tại Checkpoint 1</h2>
        </div>
        <div id="roster-list"></div>
      </div>

      <aside class="caseview-side">
        <div class="policy-grid policy-grid-stack">
          <div class="policy-card policy-act">
            <span class="overline">AI được tự Act khi</span>
            <div id="policy-act-rule"></div>
          </div>
          <div class="policy-card policy-ask">
            <span class="overline">AI luôn Ask / chuyển bạn khi</span>
            <div id="policy-ask-rule"></div>
          </div>
        </div>
        <details class="guardrails">
          <summary>Guardrail đang áp dụng</summary>
          <ul id="guardrail-list"></ul>
        </details>

        <div class="state-head-sub">
          <h2>Hoạt động gần đây</h2>
        </div>
        <div id="activity-list" class="timeline"></div>
      </aside>
    </div>
  </main>

  <div id="overlay-root"></div>

  <script src="data.js"></script>
  <script src="labcoach-dashboard.js"></script>
</body>
</html>
